# Site Settings
title: Jack Mustonen - Software Developer Portfolio
description: >-
  Software Developer specializing in AI, Machine Learning, and Data Science. 
  View my projects, experience, and get in touch for opportunities.
baseurl: ""
url: "https://jackmustonen.com"

# Author Information
author:
  name: Jack Mustonen
  email: jack@cookietowncookies.com

# Build Settings
theme: minima
markdown: kramdown

# Asset Settings
sass:
  sass_dir: _sass
  style: compressed

# Include Settings
include:
  - assets
  - _pages

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Custom Collections
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Default Front Matter
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "assets/**"
    values:
      sitemap: false

# Exclude Files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - README.md
  - CHANGELOG.md
  - package.json
  - package-lock.json

# Social Media
social:
  github: APinchofPepper
  linkedin: jack-mustonen-2072b32bb

# Analytics (you can add your Google Analytics ID here)
# google_analytics: UA-XXXXXXXXX-X

# Compress HTML
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: [html, head, body]
  blanklines: false
  profile: false

# SEO
twitter:
  username: 
  card: summary
logo: /assets/images/logo.png
social:
  name: Jack Mustonen
  links:
    - https://github.com/APinchofPepper
    - https://linkedin.com/in/jack-mustonen-2072b32bb/

# Asset Pipeline
assets:
  sources:
    - assets/css
    - assets/js
    - assets/images

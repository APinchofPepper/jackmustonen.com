<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jack Mustonen - Software Developer Portfolio">
    <title>{{ page.title }} | Jack Mustonen</title>
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Your custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="{{ site.baseurl }}/" class="logo">JM</a>
            <div class="nav-links">
                <a href="{{ site.baseurl }}/">Home</a>
                <a href="{{ site.baseurl }}/about/">About</a>
                <a href="{{ site.baseurl }}/portfolio/">Portfolio</a>
                <a href="{{ site.baseurl }}/resume/">Resume</a>
                <a href="{{ site.baseurl }}/contact/">Contact</a>
            </div>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>Jack Mustonen</h3>
                <p>Software Developer | Problem Solver | Innovator</p>
            </div>
            <div class="footer-section">
                <h3>Connect</h3>
                <div class="social-links">
                    <a href="https://github.com/apinchofpepper" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
            <div class="footer-section">
                <p>&copy; {{ site.time | date: '%Y' }} Jack Mustonen. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Load Lodash for utility functions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
    
    <!-- Your custom JavaScript -->
    <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
</body>
</html>
